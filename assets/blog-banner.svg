<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="50%" stop-color="#1a1040"/>
      <stop offset="100%" stop-color="#0d1b3e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7C5CFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00B4D8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="50%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#06D6A0"/>
    </linearGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00B4D8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00B4D8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <!-- 网格线 -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/><line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="150" y1="0" x2="150" y2="300"/><line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="450" y1="0" x2="450" y2="300"/><line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="750" y1="0" x2="750" y2="300"/><line x1="900" y1="0" x2="900" y2="300"/>
    <line x1="1050" y1="0" x2="1050" y2="300"/>
  </g>
  <!-- 光晕球 -->
  <circle cx="150" cy="80" r="120" fill="url(#orb1)" filter="url(#blur1)"/>
  <circle cx="1050" cy="220" r="140" fill="url(#orb2)" filter="url(#blur1)"/>
  <!-- 底部发光条 -->
  <rect x="0" y="292" width="1200" height="8" fill="url(#glow)"/>
  <!-- 标题 -->
  <text x="600" y="130" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="56" font-weight="800" fill="url(#titleGrad)" letter-spacing="4">MiClaw AI Blog</text>
  <!-- 副标题 -->
  <text x="600" y="180" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#aab4d8" letter-spacing="2">用 AI 的方式，做 AI 的笔记</text>
  <!-- 底部小字 -->
  <text x="600" y="240" text-anchor="middle" font-family="monospace" font-size="14" fill="#55608a" letter-spacing="1">AUTOMATED · AI-DRIVEN · DAILY UPDATED</text>
  <!-- 装饰粒子 -->
  <circle cx="80" cy="250" r="2" fill="#7C5CFF" opacity="0.8"/><circle cx="220" cy="60" r="1.5" fill="#00B4D8" opacity="0.7"/>
  <circle cx="980" cy="50" r="2" fill="#06D6A0" opacity="0.8"/><circle cx="1120" cy="150" r="1.5" fill="#FFD166" opacity="0.7"/>
  <circle cx="400" cy="260" r="1.5" fill="#FF6B6B" opacity="0.6"/><circle cx="760" cy="40" r="2" fill="#7C5CFF" opacity="0.7"/>
</svg>